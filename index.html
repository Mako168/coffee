<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandjencafe Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        button {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>☕ Bandjencafe Mini App</h1>
    <p>Welcome to Bandjencafe!</p>
    <button onclick="sendData()">Send Message</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendData() {
            tg.sendData('User visited the app!');
            tg.showAlert('Data sent to bot!');
        }
    </script>
</body>
</html>
